<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6"><meta name="description" content="Hide a little message in moonlight.">
<title>Moon Letter</title>
<style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#55504e;background:#faf9f6}*{box-sizing:border-box}body{margin:0}button,textarea,a{-webkit-tap-highlight-color:transparent}main{width:min(100% - 48px,560px);min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:70px 0;gap:24px}.input-wrap{position:relative}textarea{display:block;width:100%;min-height:160px;max-height:330px;resize:none;border:0;border-bottom:1px solid #e4dfd9;border-radius:0;padding:20px 0 30px;background:transparent;outline:none;font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,4vw,32px);font-weight:400;line-height:1.6;letter-spacing:-.025em;color:#514642;overflow:auto}textarea::placeholder{color:#bcb4ab;opacity:1}textarea:focus{border-color:#bda99b}textarea[readonly]{color:#65534e}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:12px;align-items:center}.icon{height:46px;width:46px;flex:0 0 46px;display:inline-flex;justify-content:center;align-items:center;border:1px solid #e7e1db;background:transparent;border-radius:50%;color:#8d7d72;cursor:pointer;text-decoration:none;transition:background .2s,transform .2s,border-color .2s}.icon:hover{background:#f0eae3;border-color:#d3c1b5}.icon:active{transform:scale(.95)}.icon:focus-visible{outline:2px solid #aa8275;outline-offset:5px}.icon.primary{background:#ae897a;color:#fff9f2;border-color:#ae897a}.icon.primary:hover{background:#987261}.icon:disabled{opacity:.38;cursor:default;transform:none}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.picture{margin:0;position:relative;align-self:center;width:min(100%,360px);animation:appear .6s ease}.picture img{width:100%;height:auto;display:block;aspect-ratio:4/5;object-fit:contain;border-radius:3px;box-shadow:0 12px 40px #66504012}.picture .image-tools{display:flex;gap:10px;justify-content:center;margin-top:18px}.picture[hidden],[hidden]{display:none!important}#status{font-size:12px;line-height:1.7;letter-spacing:.02em;color:#a15e56;min-height:20px;margin:0;max-width:400px}#file{display:none}.dragging{background:#f3ede6}.dragging textarea{border-color:#ae897a}body.has-image main{padding-top:42px;padding-bottom:36px;gap:20px}body.has-image textarea{min-height:88px;font-size:23px;padding-top:4px;padding-bottom:18px;max-height:190px}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){main{width:calc(100% - 48px);padding:40px 0;gap:20px}textarea{font-size:27px;min-height:180px}.picture{width:min(100%,320px)}body.has-image main{padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<figure class="picture" id="picture" hidden>
<img id="art" alt="一轮月亮，落在温柔的海面上" width="1024" height="1280">
<div class="image-tools">
<button class="icon" id="again" type="button" aria-label="换一幅画" title="换一幅画"><svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></button>
<a class="icon" id="download" download="moon-letter.png" aria-label="保存 PNG 原图" title="保存 PNG 原图"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg></a>
<button class="icon" id="share" type="button" aria-label="分享 PNG 原图" title="分享 PNG 原图" hidden><svg viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M6 10H4v11h16V10h-2"/></svg></button>
</div>
</figure>
<div class="input-wrap"><textarea id="message" aria-label="输入想藏在画里的话" placeholder="Something only you would say…" maxlength="6000" spellcheck="false"></textarea></div>
<div class="controls">
<button class="icon" id="upload" type="button" aria-label="上传图片，读出密语" title="上传图片，读出密语"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg></button>
<div class="actions">
<button class="icon" id="copy" type="button" aria-label="复制密语" title="复制密语" hidden><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg></button>
<button class="icon" id="reset" type="button" aria-label="写一句新的话" title="写一句新的话" hidden><svg viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L21 7l-4-4ZM14 6l4 4"/></svg></button>
<button class="icon primary" id="generate" type="button" aria-label="把这句话藏进图片" title="把这句话藏进图片" disabled><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<input type="file" id="file" accept="image/png,.png" aria-label="选择密语 PNG 图片">
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
